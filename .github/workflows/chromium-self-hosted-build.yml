name: Chromium Android Proof Build (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "Explicitly authorize the long-running Chromium source/build job"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"
      chromium_revision:
        description: "Exact 40-character Chromium Git commit SHA"
        required: true
        type: string
      depot_tools_revision:
        description: "Exact 40-character depot_tools Git commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chromium-self-hosted-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  confirmation:
    name: Require explicit build confirmation
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Check explicit confirmation
        id: gate
        env:
          CONFIRM_BUILD: ${{ inputs.confirm_build }}
        shell: bash
        run: |
          if [[ "$CONFIRM_BUILD" == "yes" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "Explicit confirmation received on main."
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "No Chromium build was started. Dispatch this workflow from main only."
            else
              echo "No Chromium build was started. Select confirm_build=yes to authorize the long-running job."
            fi
          fi

  build:
    name: Build and verify upstream Chromium arm64 APK
    needs: confirmation
    if: needs.confirmation.outputs.approved == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, chromium-builder]
    timeout-minutes: 360
    env:
      CHROMIUM_REVISION: ${{ inputs.chromium_revision }}
      DEPOT_TOOLS_REVISION: ${{ inputs.depot_tools_revision }}
    steps:
      - name: Check out MVM Browser build scripts
        uses: actions/checkout@v4

      - name: Validate exact pinned revisions
        shell: bash
        run: |
          [[ "$CHROMIUM_REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "CHROMIUM_REVISION must be a full 40-character Git commit SHA." >&2
            exit 2
          }
          [[ "$DEPOT_TOOLS_REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "DEPOT_TOOLS_REVISION must be a full 40-character Git commit SHA." >&2
            exit 2
          }

      - name: Check dedicated build host
        run: bash scripts/check-chromium-build-host.sh

      - name: Build unbranded upstream Chromium proof APK
        run: bash scripts/build-chromium-android.sh

      - name: Verify APK provenance, package metadata and signature
        run: bash scripts/verify-chromium-apk.sh

      - name: Summarize verified build provenance
        shell: bash
        run: |
          BUILD_ROOT="${CHROMIUM_ROOT:-$HOME/chromium-mvm}"
          META="$BUILD_ROOT/MVM-Chromium-arm64.metadata.txt"
          value() { sed -n "s/^$1=//p" "$META" | head -n 1; }
          {
            echo "## Chromium Android proof build"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Chromium revision | $(value chromium_revision) |"
            echo "| depot_tools revision | $(value depot_tools_revision) |"
            echo "| depot_tools auto-update | $(value depot_tools_auto_update) |"
            echo "| Target | $(value target_os) / $(value target_cpu) |"
            echo "| APK SHA-256 | $(value apk_sha256) |"
            echo "| GN args SHA-256 | $(value gn_args_sha256) |"
            echo
            echo "This is an unbranded proof build, not the finished MVM Browser."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage proof-build artifacts
        shell: bash
        run: |
          BUILD_ROOT="${CHROMIUM_ROOT:-$HOME/chromium-mvm}"
          test -s "$BUILD_ROOT/MVM-Chromium-arm64.apk"
          test -s "$BUILD_ROOT/MVM-Chromium-arm64.metadata.txt"
          test -s "$BUILD_ROOT/MVM-Chromium-arm64.args.gn"
          mkdir -p chromium-build-artifact
          cp "$BUILD_ROOT/MVM-Chromium-arm64.apk" chromium-build-artifact/
          cp "$BUILD_ROOT/MVM-Chromium-arm64.metadata.txt" chromium-build-artifact/
          cp "$BUILD_ROOT/MVM-Chromium-arm64.args.gn" chromium-build-artifact/
          sha256sum chromium-build-artifact/*
          ls -lh chromium-build-artifact/

      - name: Upload proof-build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MVM-Chromium-arm64-proof-build
          path: chromium-build-artifact/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
