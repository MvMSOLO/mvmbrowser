name: MVM Browser APK Release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mvm-browser-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
        shell: bash
        run: |
          TAG="mvm-browser-build-${RUN_NUMBER}"
          gh release create "$TAG" "$APK_PATH#MVM-Browser.apk" \
            --repo "$REPOSITORY" \
            --title "MVM Browser APK build ${RUN_NUMBER}" \
            --notes "Automatically built from commit ${GITHUB_SHA}. This release contains the current MVM Browser Android APK. The current browser rendering engine is Android System WebView; bundled Chromium integration is still in progress."
