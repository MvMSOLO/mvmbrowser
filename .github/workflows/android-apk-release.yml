name: MVM Browser APK Release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mvm-browser-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and prepare checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" "MVM-Browser.apk"
          sha256sum "MVM-Browser.apk" | tee "MVM-Browser.apk.sha256"
          ls -lh "MVM-Browser.apk" "MVM-Browser.apk.sha256"

      - name: Publish debug APK and checksum as GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mvm-browser-build-${RUN_NUMBER}"
          gh release create "$TAG" "MVM-Browser.apk" "MVM-Browser.apk.sha256" \
            --repo "$REPOSITORY" \
            --title "MVM Browser debug APK build ${RUN_NUMBER}" \
            --notes "Automated debug build from commit ${GITHUB_SHA}. Android unit tests passed before packaging. This installable APK uses the Android debug signing key and the debug application ID com.mvmsolo.mvmbrowser.debug; it is for testing, not a production/Play Store release. SHA-256 is provided in MVM-Browser.apk.sha256. The current browser engine is Android System WebView; bundled Cromite/Chromium integration is not included in this APK."
