name: Chromium Upstream Resource Watch

on:
  push:
    branches: [main]
    paths:
      - "scripts/report-chromium-upstream-status.py"
      - ".github/workflows/chromium-upstream-watch.yml"
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Check public Chromium release signals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate read-only status report
        id: report
        run: python3 scripts/report-chromium-upstream-status.py --output chromium-upstream-status.md --strict
      - name: Save report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-upstream-status
          path: chromium-upstream-status.md
          if-no-files-found: warn
          retention-days: 30
