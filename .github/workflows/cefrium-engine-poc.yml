name: Cefrium Chromium Engine Proof

on:
  push:
    branches:
      - experiment/cefrium-proof-154
    paths:
      - "experiments/cefrium-proof/**"
      - ".github/workflows/cefrium-engine-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cefrium-engine-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify ARM64 Chromium proof APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's legacy default installs the removed "tools" package.
          # Install only the maintained platform-tools package here; pin the
          # required platform and build-tools in the next explicit step.
          packages: "platform-tools"

      - name: Install Android 37 platform and build-tools
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Run proof app unit tests and compile APK
        working-directory: experiments/cefrium-proof
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Verify APK package, ABI, and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/cefrium-proof/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.mvmsolo.mvmbrowser.cefriumproof'"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libcef.so"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: MVM-Cefrium-154-arm64-proof
          path: experiments/cefrium-proof/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
