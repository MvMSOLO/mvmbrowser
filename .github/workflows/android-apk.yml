name: Build Android APK

on:
  push:
    branches:
      - feat/animated-icons-android-apk
  workflow_dispatch:
    inputs:
      web_url:
        description: "Deployed MVM Browser URL (HTTPS), loaded inside the APK"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MVM_WEB_URL: ${{ inputs.web_url || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployed URL
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.MVM_WEB_URL ?? "";
          if (!raw) {
            console.log("No hosted URL supplied; building the local shell APK.");
          } else {
            let url;
            try { url = new URL(raw); } catch { throw new Error("Enter a valid deployed HTTPS URL in the workflow input."); }
            if (url.protocol !== "https:") throw new Error("The APK wrapper only accepts HTTPS URLs.");
            if (url.username || url.password) throw new Error("Credentials must not be embedded in the URL.");
            console.log("Target URL:", url.origin);
          }
          NODE

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor CLI and Android platform
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mvm-browser-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
