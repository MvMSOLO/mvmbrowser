name: Chromium build script quick check (manual)

# Automatic validation lives in chromium-bootstrap-check.yml.
# Keep this small one available for an intentional manual syntax check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Validate Chromium bootstrap script
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n scripts/build-chromium-android.sh
      - name: Confirm required build target is documented
        run: grep -q 'chrome_public_apk' scripts/build-chromium-android.sh
