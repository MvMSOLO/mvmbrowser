name: Web app CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "src/**"
      - "server/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".grok/app-env.json"
      - ".github/workflows/web-app-ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reconcile existing npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build and migrations
        run: npm run build
      - name: Export reconciled lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciled-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
