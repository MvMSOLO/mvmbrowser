name: Chromium Bootstrap Scripts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-chromium-android.sh'
      - 'scripts/check-chromium-build-host.sh'
      - 'scripts/check-chromium-source-clean.sh'
      - 'scripts/verify-chromium-apk.sh'
      - 'scripts/smoke-test-chromium-device.sh'
      - 'scripts/report-chromium-upstream-status.py'
      - 'tests/test_chromium_upstream_status.py'
      - '.github/workflows/chromium-build-script-check.yml'
      - '.github/workflows/chromium-upstream-watch.yml'
      - '.github/workflows/chromium-bootstrap-check.yml'
      - '.github/workflows/chromium-self-hosted-build.yml'
  pull_request:
    paths:
      - 'scripts/build-chromium-android.sh'
      - 'scripts/check-chromium-build-host.sh'
      - 'scripts/check-chromium-source-clean.sh'
      - 'scripts/verify-chromium-apk.sh'
      - 'scripts/smoke-test-chromium-device.sh'
      - 'scripts/report-chromium-upstream-status.py'
      - 'tests/test_chromium_upstream_status.py'
      - '.github/workflows/chromium-build-script-check.yml'
      - '.github/workflows/chromium-upstream-watch.yml'
      - '.github/workflows/chromium-bootstrap-check.yml'
      - '.github/workflows/chromium-self-hosted-build.yml'

permissions:
  contents: read

jobs:
  bash-syntax:
    name: Validate bootstrap scripts (no Chromium build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: |
          bash -n scripts/build-chromium-android.sh
          bash -n scripts/check-chromium-build-host.sh
          bash -n scripts/check-chromium-source-clean.sh
          bash -n scripts/verify-chromium-apk.sh
          bash -n scripts/smoke-test-chromium-device.sh
      - name: Validate and test upstream release report
        run: |
          python3 -m py_compile scripts/report-chromium-upstream-status.py
          python3 -m unittest discover -s tests -p 'test_chromium_upstream_status.py' -v
      - name: Verify build guardrails
        run: |
          grep -Fq 'fetch --nohooks --no-history android' scripts/build-chromium-android.sh
          grep -Fq 'CHROMIUM_MIN_FREE_GB=' scripts/build-chromium-android.sh
          grep -Fq 'CHROMIUM_MIN_FREE_GB must be a positive whole number' scripts/build-chromium-android.sh
          grep -Fq 'must not contain whitespace' scripts/build-chromium-android.sh
          grep -Fq 'ALLOW_UNKNOWN_MEMORY=1' scripts/build-chromium-android.sh
          grep -Fq 'CHROMIUM_REVISION contains unsupported characters' scripts/build-chromium-android.sh
          grep -Fq 'CHROMIUM_REVISION=' scripts/build-chromium-android.sh
          grep -Fq 'DEPOT_TOOLS_REVISION=' scripts/build-chromium-android.sh
          grep -Fq 'DEPOT_TOOLS_REVISION contains unsupported characters' scripts/build-chromium-android.sh
          grep -Fq 'DEPOT_TOOLS_UPDATE must be set to 0 or 1' scripts/build-chromium-android.sh
          grep -Fq 'depot_tools_auto_update=$DEPOT_TOOLS_UPDATE' scripts/build-chromium-android.sh
          grep -Fq 'check-chromium-source-clean.sh' scripts/build-chromium-android.sh
          grep -Fq 'SOURCE CHECK FAILED' scripts/check-chromium-source-clean.sh
          grep -Fq 'Commit, stash, or remove local source changes before building.' scripts/check-chromium-source-clean.sh
          grep -Fq 'chromium_source_tree_clean=true' scripts/build-chromium-android.sh
          grep -Fq 'FETCH_HEAD^{commit}' scripts/build-chromium-android.sh
          grep -Fq 'MVM-Chromium-arm64.metadata.txt' scripts/build-chromium-android.sh
          grep -Fq 'MVM-Chromium-arm64.args.gn' scripts/build-chromium-android.sh
          grep -Fq 'interactive confirmation' scripts/smoke-test-chromium-device.sh
          grep -Fq 'GN args SHA-256:' scripts/build-chromium-android.sh
          grep -Fq 'GN_ARGS_SHA256=' scripts/build-chromium-android.sh
          grep -Fq '/sys/fs/cgroup/memory.max' scripts/build-chromium-android.sh
          grep -Fq '/sys/fs/cgroup/memory.max' scripts/check-chromium-build-host.sh
          grep -Fq 'chrome_public_apk' scripts/build-chromium-android.sh
          grep -Fq 'APK_SHA256=' scripts/build-chromium-android.sh
          grep -Fq 'depot_tools revision:' scripts/build-chromium-android.sh
          grep -Fq 'install-build-deps.sh --no-prompt' scripts/build-chromium-android.sh
          grep -Fq 'sudo -n true' scripts/build-chromium-android.sh
          grep -Fq 'exists but is not a depot_tools' scripts/build-chromium-android.sh
          grep -Fq 'gclient sync --nohooks' scripts/build-chromium-android.sh
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/chromium-self-hosted-build.yml", aliases: true)'
          grep -Fq 'workflow_dispatch:' .github/workflows/chromium-self-hosted-build.yml
          grep -Fq 'default: "no"' .github/workflows/chromium-self-hosted-build.yml
          grep -Fq 'runs-on: [self-hosted, linux, x64, chromium-builder]' .github/workflows/chromium-self-hosted-build.yml
          grep -Fq 'GITHUB_REF" == "refs/heads/main"' .github/workflows/chromium-self-hosted-build.yml
          grep -Fq "github.ref == 'refs/heads/main'" .github/workflows/chromium-self-hosted-build.yml
          grep -Fq 'must be a full 40-character Git commit SHA' .github/workflows/chromium-self-hosted-build.yml
          grep -Fq 'compression-level: 0' .github/workflows/chromium-self-hosted-build.yml
          if grep -Eq '^  (push|pull_request|schedule):' .github/workflows/chromium-self-hosted-build.yml; then
            echo "The expensive Chromium build workflow must be manual-dispatch only." >&2
            exit 1
          fi
      - name: Test preflight pass and fail paths
        shell: bash
        run: |
          CHROMIUM_MIN_RAM_GIB=1 CHROMIUM_MIN_FREE_GB=1 \
            bash scripts/check-chromium-build-host.sh > preflight-pass.txt
          grep -Fq 'RESULT: basic requirements pass.' preflight-pass.txt

          if CHROMIUM_MIN_RAM_GIB=1 CHROMIUM_MIN_FREE_GB=999999 \
            bash scripts/check-chromium-build-host.sh > preflight-blocked.txt 2>&1; then
            echo "Expected the preflight to block an impossible disk threshold." >&2
            exit 1
          fi
          grep -Fq 'RESULT: NOT READY' preflight-blocked.txt

      - name: Test Chromium source cleanliness guard
        shell: bash
        run: |
          clean_root="$RUNNER_TEMP/chromium-source-clean-test"
          mkdir -p "$clean_root"
          git -C "$clean_root" init -q
          git -C "$clean_root" config user.name "CI Test"
          git -C "$clean_root" config user.email "ci-test@example.invalid"
          printf 'clean baseline\n' > "$clean_root/README.md"
          git -C "$clean_root" add README.md
          git -C "$clean_root" commit -q -m 'initial test fixture'

          bash scripts/check-chromium-source-clean.sh "$clean_root" > source-clean-pass.txt
          grep -Fq 'SOURCE CHECK PASSED' source-clean-pass.txt
          grep -Eq 'Chromium revision: [0-9a-f]{40}' source-clean-pass.txt

          printf 'untracked content\n' > "$clean_root/untracked.txt"
          if bash scripts/check-chromium-source-clean.sh "$clean_root" > source-untracked-fail.txt 2>&1; then
            echo "Expected an untracked file to fail the source cleanliness check." >&2
            exit 1
          fi
          grep -Fq 'SOURCE CHECK FAILED' source-untracked-fail.txt

          rm "$clean_root/untracked.txt"
          printf 'modified content\n' >> "$clean_root/README.md"
          if bash scripts/check-chromium-source-clean.sh "$clean_root" > source-modified-fail.txt 2>&1; then
            echo "Expected a tracked modification to fail the source cleanliness check." >&2
            exit 1
          fi
          grep -Fq 'SOURCE CHECK FAILED' source-modified-fail.txt

      - name: Verify build script stops before network work on insufficient disk
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mvm-chromium-test"
          if CHROMIUM_MIN_FREE_GB=999999 \
            CHROMIUM_ROOT="$RUNNER_TEMP/mvm-chromium-test" \
            bash scripts/build-chromium-android.sh > build-blocked.txt 2>&1; then
            echo "Expected the build script to reject the artificial disk requirement." >&2
            exit 1
          fi
          grep -Fq 'need at least 999999 GiB' build-blocked.txt
          if grep -Fq 'Fetching Chromium Android source' build-blocked.txt; then
            echo "Build script started a source fetch despite a failed preflight." >&2
            exit 1
          fi

      - name: Reject invalid build configuration before network work
        shell: bash
        run: |
          if CHROMIUM_MIN_FREE_GB=not-a-number \
            CHROMIUM_ROOT="$RUNNER_TEMP/mvm-invalid-threshold" \
            bash scripts/build-chromium-android.sh > invalid-threshold.txt 2>&1; then
            echo "Expected invalid disk threshold to be rejected." >&2
            exit 1
          fi
          grep -Fq 'CHROMIUM_MIN_FREE_GB must be a positive whole number' invalid-threshold.txt

          if CHROMIUM_REVISION='--help' \
            CHROMIUM_ROOT="$RUNNER_TEMP/mvm-invalid-revision" \
            bash scripts/build-chromium-android.sh > invalid-revision.txt 2>&1; then
            echo "Expected an option-like revision to be rejected." >&2
            exit 1
          fi
          grep -Fq 'CHROMIUM_REVISION contains unsupported characters' invalid-revision.txt

          if DEPOT_TOOLS_REVISION='--help' \
            CHROMIUM_ROOT="$RUNNER_TEMP/mvm-invalid-tools-revision" \
            bash scripts/build-chromium-android.sh > invalid-tools-revision.txt 2>&1; then
            echo "Expected an option-like depot_tools revision to be rejected." >&2
            exit 1
          fi
          grep -Fq 'DEPOT_TOOLS_REVISION contains unsupported characters' invalid-tools-revision.txt

          if DEPOT_TOOLS_UPDATE=yes \
            CHROMIUM_ROOT="$RUNNER_TEMP/mvm-invalid-tools-update" \
            bash scripts/build-chromium-android.sh > invalid-tools-update.txt 2>&1; then
            echo "Expected invalid depot_tools auto-update setting to be rejected." >&2
            exit 1
          fi
          grep -Fq 'DEPOT_TOOLS_UPDATE must be set to 0 or 1' invalid-tools-update.txt

          spaced_root="$RUNNER_TEMP/mvm chromium invalid path"
          if CHROMIUM_ROOT="$spaced_root" \
            bash scripts/build-chromium-android.sh > spaced-path.txt 2>&1; then
            echo "Expected a Chromium workspace path containing spaces to be rejected." >&2
            exit 1
          fi
          grep -Fq 'must not contain whitespace' spaced-path.txt
          if [[ -e "$spaced_root" ]]; then
            echo "Build script created an invalid workspace before rejecting its path." >&2
            exit 1
          fi

          # Relative paths must be rejected when the caller's current directory
          # contains whitespace, even if the supplied variable itself does not.
          spaced_cwd="$RUNNER_TEMP/chromium cwd with spaces"
          mkdir -p "$spaced_cwd"
          if (cd "$spaced_cwd" && CHROMIUM_ROOT=relative-workspace \
            bash "$GITHUB_WORKSPACE/scripts/build-chromium-android.sh" \
              > "$RUNNER_TEMP/relative-path-spaces.txt" 2>&1); then
            echo "Expected a relative path under a whitespace-containing CWD to be rejected." >&2
            exit 1
          fi
          grep -Fq 'paths must not contain whitespace' "$RUNNER_TEMP/relative-path-spaces.txt"
          if [[ -e "$spaced_cwd/relative-workspace" ]]; then
            echo "Build script created a relative workspace before resolving and rejecting its path." >&2
            exit 1
          fi

      - name: Test offline Chromium APK provenance verifier
        shell: bash
        run: |
          test_root="$RUNNER_TEMP/chromium-verifier-test"
          mkdir -p "$test_root"
          test_apk="$test_root/MVM-Chromium-arm64.apk"
          test_args="$test_root/MVM-Chromium-arm64.args.gn"
          test_metadata="$test_root/MVM-Chromium-arm64.metadata.txt"

          cat > "$test_args" <<'GN_ARGS'
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          GN_ARGS

          python3 - "$test_apk" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1], "w", compression=zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("AndroidManifest.xml", b"synthetic manifest fixture")
              archive.writestr("META-INF/test.txt", "synthetic verifier fixture")
          PY

          apk_sha="$(sha256sum "$test_apk" | awk '{print $1}')"
          args_sha="$(sha256sum "$test_args" | awk '{print $1}')"
          cat > "$test_metadata" <<METADATA
          build_date_utc=2026-10-11T00:00:00Z
          host_os=Ubuntu-test
          host_arch=x86_64
          chromium_revision=0123456789abcdef0123456789abcdef01234567
          depot_tools_revision=abcdef0123456789abcdef0123456789abcdef01
          target_os=android
          target_cpu=arm64
          gn_args_file=MVM-Chromium-arm64.args.gn
          gn_args_sha256=$args_sha
          apk_file=MVM-Chromium-arm64.apk
          apk_sha256=$apk_sha
          METADATA

          fake_aapt="$test_root/fake-aapt"
          cat > "$fake_aapt" <<'AAPT'
          #!/usr/bin/env bash
          [[ "${1:-}" == "dump" && "${2:-}" == "badging" ]] || exit 2
          cat <<BADGING
          package: name='org.chromium.chrome' versionCode='1' versionName='MVM test'
          sdkVersion:'${FAKE_MIN_SDK:-29}'
          native-code: 'arm64-v8a'
          BADGING
          AAPT
          chmod +x "$fake_aapt"

          fake_apksigner="$test_root/fake-apksigner"
          cat > "$fake_apksigner" <<'APKSIGNER'
          #!/usr/bin/env bash
          [[ "${1:-}" == "verify" && "${2:-}" == "--verbose" && "${3:-}" == "--print-certs" ]] || exit 2
          if [[ "${FAKE_APKSIGNER_FAIL:-0}" == "1" ]]; then
            echo "DOES NOT VERIFY" >&2
            exit 1
          fi
          echo "Verifies"
          echo "Signer #1 certificate SHA-256 digest: 0123456789abcdef"
          APKSIGNER
          chmod +x "$fake_apksigner"

          AAPT="$fake_aapt" APKSIGNER="$fake_apksigner" bash scripts/verify-chromium-apk.sh "$test_apk" > verifier-pass.txt
          grep -Fq 'VERIFY PASSED' verifier-pass.txt
          grep -Fq 'Package ID: org.chromium.chrome' verifier-pass.txt
          grep -Fq 'Minimum Android API: 29' verifier-pass.txt
          grep -Fq 'Native ABI: arm64-v8a' verifier-pass.txt
          grep -Fq 'APK signature: verified by apksigner' verifier-pass.txt
          grep -Fq 'Signer certificate SHA-256: 0123456789abcdef' verifier-pass.txt

          if AAPT="$fake_aapt" APKSIGNER="$fake_apksigner" FAKE_APKSIGNER_FAIL=1 \
            bash scripts/verify-chromium-apk.sh "$test_apk" > verifier-signature-fail.txt 2>&1; then
            echo "Expected the APK verifier to reject failed signature verification." >&2
            exit 1
          fi
          grep -Fq 'APK signature verification failed' verifier-signature-fail.txt

          if AAPT="$fake_aapt" FAKE_MIN_SDK=28 bash scripts/verify-chromium-apk.sh "$test_apk" > verifier-api-fail.txt 2>&1; then
            echo "Expected the APK verifier to reject minSdkVersion below API 29." >&2
            exit 1
          fi
          grep -Fq 'expected to require API 29 or newer' verifier-api-fail.txt

          mkdir -p "$test_root/src/out/MVM/bin"
          cat > "$test_root/src/out/MVM/bin/chrome_public_apk" <<'WRAPPER'
          #!/usr/bin/env bash
          echo "Unexpected wrapper execution in preflight-only test." >&2
          exit 99
          WRAPPER
          chmod +x "$test_root/src/out/MVM/bin/chrome_public_apk"

          fake_adb="$test_root/fake-adb"
          cat > "$fake_adb" <<'ADB'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "devices" ]]; then
            printf 'List of devices attached\nTEST-DEVICE\tdevice\n'
            exit 0
          fi
          if [[ "${1:-}" == "-s" ]]; then
            shift 2
            if [[ "${1:-}" == "shell" && "${2:-}" == "getprop" ]]; then
              case "${3:-}" in
                ro.build.version.sdk) echo "${FAKE_ANDROID_SDK:-35}"; exit 0 ;;
                ro.product.cpu.abi) echo "${FAKE_ANDROID_ABI:-arm64-v8a}"; exit 0 ;;
              esac
            fi
          fi
          echo "Unexpected fake adb command: $*" >&2
          exit 3
          ADB
          chmod +x "$fake_adb"

          CHROMIUM_ROOT="$test_root" ADB="$fake_adb" \
            bash scripts/smoke-test-chromium-device.sh --serial TEST-DEVICE > device-ready.txt
          grep -Fq 'DEVICE READY: TEST-DEVICE' device-ready.txt
          grep -Fq 'Preflight only: no installation or launch was attempted.' device-ready.txt

          if CHROMIUM_ROOT="$test_root" ADB="$fake_adb" FAKE_ANDROID_SDK=28 \
            bash scripts/smoke-test-chromium-device.sh --serial TEST-DEVICE > old-android.txt 2>&1; then
            echo "Expected the device preflight to reject Android SDK 28." >&2
            exit 1
          fi
          grep -Fq 'requires Android 10 / API 29 or newer' old-android.txt

          printf '\n# altered after build\n' >> "$test_args"
          if bash scripts/verify-chromium-apk.sh "$test_apk" > verifier-fail.txt 2>&1; then
            echo "Expected modified GN args to fail checksum verification." >&2
            exit 1
          fi
          grep -Fq 'GN args checksum does not match metadata' verifier-fail.txt
