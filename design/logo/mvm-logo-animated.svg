<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MVM Browser logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="mg" x1="66" y1="0" x2="446" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#FF2E93"/>
  </linearGradient>
  <filter id="mglow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .hex{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .1s cubic-bezier(.6,0,.2,1) forwards}
  .mark{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .5s cubic-bezier(.6,0,.2,1) forwards}
  .glow{animation:breathe 2.4s 1.6s ease-in-out infinite}
  .rgb-r,.rgb-b{opacity:0;mix-blend-mode:screen}
  .rgb-r{animation:glitch .12s 1.45s 1}
  .rgb-b{animation:glitch .12s 1.45s 1 reverse}
  .ring{opacity:0;transform-origin:256px 256px;animation:shock .7s 1.5s ease-out 1}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes glitch{0%{opacity:.9;transform:translate(-6px,0)}50%{opacity:.9;transform:translate(6px,2px)}100%{opacity:0;transform:translate(0,0)}}
  @keyframes shock{0%{opacity:.8;transform:scale(.7)}100%{opacity:0;transform:scale(1.25)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.hex,.mark{stroke-dashoffset:0}}
</style>
<rect width="512" height="512" fill="#05060A"/>
<g class="glow" filter="url(#mglow)">
  <path class="hex" pathLength="1" d="M256 36 L446 146 L446 366 L256 476 L66 366 L66 146 Z" fill="none" stroke="url(#mg)" stroke-width="8" stroke-linejoin="miter"/>
  <path class="mark" pathLength="1" transform="translate(0,-22)" d="M92 320 L92 190 L142 255 L192 190 L192 320 L222 190 L256 370 L290 190 L320 320 L320 190 L370 255 L420 190 L420 320" fill="none" stroke="url(#mg)" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter"/>
</g>
<path class="rgb-r" transform="translate(0,-22)" d="M92 320 L92 190 L142 255 L192 190 L192 320 L222 190 L256 370 L290 190 L320 320 L320 190 L370 255 L420 190 L420 320" fill="none" stroke="#FF2E2E" stroke-width="22" stroke-linejoin="miter"/>
<path class="rgb-b" transform="translate(0,-22)" d="M92 320 L92 190 L142 255 L192 190 L192 320 L222 190 L256 370 L290 190 L320 320 L320 190 L370 255 L420 190 L420 320" fill="none" stroke="#2E5BFF" stroke-width="22" stroke-linejoin="miter"/>
<path class="ring" d="M256 36 L446 146 L446 366 L256 476 L66 366 L66 146 Z" fill="none" stroke="#00F0FF" stroke-width="3"/>
</svg>
