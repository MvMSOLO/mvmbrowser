<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060A" />
    <title>MVM Browser</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #05060a; color: #eafaff; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 35%, #08212b 0%, #05060a 58%); }
      main { width: min(88vw, 420px); text-align: center; }
      .mark { display: inline-grid; place-items: center; width: 64px; height: 64px; border: 1px solid #00e5ff88; border-radius: 20px; color: #00e5ff; box-shadow: 0 0 32px #00e5ff20; font-size: 24px; font-weight: 800; }
      h1 { margin: 22px 0 8px; font-size: 24px; letter-spacing: -.04em; }
      p { color: #94aab6; line-height: 1.6; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <h1>MVM Browser</h1>
      <p>This Android shell is configured by the GitHub Actions workflow to load the deployed HTTPS version of MVM Browser.</p>
    </main>
  </body>
</html>
